<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore our college, discover our courses, and learn more about our programs.">
    <title>Home Page</title>
    
    <style>
        :root {
            --navy: #17324d;
            --blue: #2867a5;
            --light-blue: #eef5fb;
            --text: #273444;
            --muted: #64748b;
            --white: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            background: #f8fafc;
        }

        .site-header {
            background: var(--white);
            border-bottom: 1px solid #e5eaf0;
        }

        .header-inner {
            width: min(1100px, 92%);
            margin: 0 auto;
            padding: 18px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            margin: 0;
            color: var(--navy);
            font-size: 1.4rem;
            letter-spacing: -0.03em;
        }

        h1 {
            background-color: blanchedalmond;
            text-align: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        nav a {
            padding: 9px 13px;
            color: var(--text);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
        }

        nav a:hover,
        nav a:focus-visible {
            color: var(--blue);
            background: var(--light-blue);
        }

        main {
            width: min(1100px, 92%);
            margin: 0 auto;
        }

        .hero {
            margin: 38px 0;
            padding: clamp(32px, 6vw, 68px);
            color: var(--white);
            background: linear-gradient(120deg, #17324d, #2867a5);
            border-radius: 18px;
        }

        .hero p {
            max-width: 620px;
            margin: 0 0 12px;
            color: #dceaf7;
        }

        .hero h2 {
            max-width: 680px;
            margin: 0 0 16px;
            font-size: clamp(2rem, 5vw, 3.4rem);
            line-height: 1.12;
        }

        .button {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 19px;
            color: var(--navy);
            background: var(--white);
            border-radius: 7px;
            font-weight: 700;
            text-decoration: none;
        }

        .button:hover,
        .button:focus-visible {
            background: #e8f1fa;
        }

        .section-heading {
            margin: 0 0 18px;
            color: var(--navy);
            font-size: 1.65rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 38px;
        }

        .gallery img {
            display: block;
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 8px 22px rgb(23 50 77 / 10%);
        }

        .application {
            margin-bottom: 44px;
            padding: clamp(24px, 4vw, 38px);
            background: var(--white);
            border: 1px solid #e5eaf0;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgb(23 50 77 / 5%);
        }

        .application p {
            margin-top: -8px;
            color: var(--muted);
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            align-items: end;
        }

        .field {
            display: grid;
            gap: 7px;
        }

        label {
            font-size: 0.92rem;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 44px;
            padding: 10px 12px;
            color: var(--text);
            background: var(--white);
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        input:focus {
            outline: 3px solid rgb(40 103 165 / 20%);
            border-color: var(--blue);
        }

        button {
            min-height: 44px;
            padding: 10px 18px;
            color: var(--white);
            background: var(--blue);
            border: 0;
            border-radius: 6px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover,
        button:focus-visible {
            background: var(--navy);
        }

        footer {
            padding: 20px;
            color: var(--muted);
            background: var(--white);
            border-top: 1px solid #e5eaf0;
            text-align: center;
            font-size: 0.9rem;
        }

        @media (max-width: 640px) {
            .header-inner {
                align-items: flex-start;
                flex-direction: column;
            }

            nav {
                gap: 2px;
            }

            nav a {
                padding: 8px 10px;
            }

            .gallery,
            form {
                grid-template-columns: 1fr;
            }

            .gallery img {
                height: 220px;
            }
        }

    </style>
</head>
<body>
     <header class="site-header">
        <div class="header-inner">
        <h1>Index</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="courses.html">Courses</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <br><br>

    <div class="gallery">
        <img src="images/Butterfly.jpg" alt="Butterfly">
        <img src="images/OIP.webp" alt="Another Image">
    </div>

</body>
<tbody>
    <form action="/apply" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>

        <button type="submit">Apply</button>
    </form>
</tbody>
</html>
